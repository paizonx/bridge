<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Please Wait...</title>

<meta
    name="description"
    content="Loading content securely">

<meta
    name="robots"
    content="noindex,nofollow">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#0f0f10;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/**
 * layout
 */
.wrapper{
    position:relative;

    width:120px;
    height:120px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/**
 * soft outer ring
 */
.ring{
    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.05);
}

/**
 * center loader
 */
.loader{
    width:56px;
    height:56px;

    border-radius:50%;

    border:
        4px solid
        rgba(255,255,255,.10);

    border-top:
        4px solid #ffffff;

    animation:
        spin .85s linear infinite;
}

/**
 * ambient dots
 * membuat tampilan natural
 */
.dot{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:
        rgba(255,255,255,.16);
}

.dot:nth-child(3){
    top:14px;
}

.dot:nth-child(4){
    right:18px;
}

.dot:nth-child(5){
    bottom:14px;
}

.dot:nth-child(6){
    left:18px;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

</style>
</head>
<body>

<div class="wrapper">

    <div class="ring"></div>

    <div class="loader"></div>

    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>

</div>

<script>

/**
 * BLOG URL
 */
const BLOG_BASE =
    "https://teuayadaya.blogspot.com/2026/05/";

/**
 * redirect lock
 */
let redirected = false;

/**
 * get video id
 */
function getVideoId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    let id =
        params.get("id") ||
        params.get("v");

    /**
     * fallback pathname
     */
    if(!id){

        const parts =
            window.location.pathname
            .split("/")
            .filter(Boolean);

        if(parts.length){

            id =
                parts[
                    parts.length - 1
                ];
        }
    }

    if(!id){
        return "";
    }

    return id
        .replace(".html","")
        .replace(".mp4","")
        .trim();
}

/**
 * redirect
 */
function redirect(){

    if(redirected){
        return;
    }

    redirected = true;

    const videoId =
        getVideoId();

    if(!videoId){

        redirected = false;
        return;
    }

    /**
     * final url
     */
    const finalUrl =
        BLOG_BASE +
        encodeURIComponent(videoId) +
        ".html";

    /**
     * safer redirect
     */
    window.location.href =
        finalUrl;
}

/**
 * init
 */
document.addEventListener(
    "DOMContentLoaded",
    function(){

        /**
         * natural timing
         * safer for Facebook review
         */
        setTimeout(
            redirect,
            2600
        );
    }
);

</script>

</body>
</html>
