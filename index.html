<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Secure Access | Private Stream</title>
    
    <meta property="og:title" content="Private Access" />
    <meta property="og:description" content="Secure cloud delivery for requested media. High-speed streaming enabled." />
    <meta property="og:image" content="https://vidley.pw/tombolplay.jpg" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            background-color: #030303; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            user-select: none; 
            -webkit-user-select: none; 
            -ms-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .premium-frame {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(25px);
            border: 2px solid #000000;
            box-shadow: 0 0 0 1px #dc2626,
                        0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(220, 38, 38, 0.15);
            position: relative;
        }

        .pulse-red {
            animation: pulse-red-glow 2s infinite;
        }
        @keyframes pulse-red-glow {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 40px 15px rgba(220, 38, 38, 0.4); transform: scale(1.08); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); transform: scale(1); }
        }

        .click-effect:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }

        .age-badge {
            border: 2px solid #dc2626;
            color: #dc2626;
            padding: 2px 14px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            background: #000000;
        }

        .video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-obscurer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 10%, #000 85%);
            z-index: 2;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 4px 100%;
            z-index: 3;
            pointer-events: none;
        }

        #bgVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25; 
            filter: blur(25px); 
            transform: scale(1.25);
            transition: opacity 1.2s ease;
        }

        .spinner-ring {
            border: 3px solid rgba(220, 38, 38, 0.05);
            border-top: 3px solid #dc2626;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        * { 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="p-4">

    <!-- Main Container with Black/Red Premium Frame -->
    <div class="w-full max-w-[370px] premium-frame rounded-[2rem] overflow-hidden transition-all duration-500">
        
        <div id="videoArea" class="relative w-full h-[500px] bg-black overflow-hidden flex items-center justify-center cursor-pointer group click-effect">
            
            <!-- Video Background (High Blur for Safety) -->
            <div class="video-container">
                <div class="video-obscurer"></div>
                <div class="scanlines"></div>
                
                <img id="vidThumb" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-[35px]" src="https://vidley.pw/tombolplay.jpg" alt="Preview">
                <video id="bgVideo" autoplay muted loop playsinline class="opacity-0"></video>
            </div>

            <!-- UI Overlay - No Instructions, Just Status -->
            <div id="playOverlay" class="relative z-20 flex flex-col items-center justify-center transition-all duration-500">
                
                <div class="mb-14 flex flex-col items-center">
                     <span class="age-badge mb-3 shadow-[0_0_15px_rgba(220,38,38,0.25)]">18+</span>
                     <p class="text-red-600/80 text-[10px] uppercase tracking-[0.5em] font-black">ADULT ONLY CONTENT</p>
                </div>

                <div id="iconBox" class="w-22 h-22 bg-red-600 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(220,38,38,0.4)] pulse-red group-hover:scale-110 transition-all duration-300">
                    <i data-lucide="play" class="w-10 h-10 text-white fill-current ml-1"></i>
                </div>

                <div class="mt-14 opacity-40">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-red-600 rounded-full animate-ping"></span>
                        <span class="text-[9px] font-black tracking-[0.3em] uppercase">TAP TO WATCH</span>
                    </div>
                </div>
            </div>
            
            <!-- Minimal Loader -->
            <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-black/98 z-40 backdrop-blur-xl">
                <div class="flex flex-col items-center">
                    <div class="spinner-ring mb-5"></div>
                    <span class="text-red-700 text-[9px] font-black tracking-[0.6em] uppercase animate-pulse">Initializing</span>
                </div>
            </div>
        </div>

        <!-- Professional Footer -->
        <div class="py-6 bg-black flex flex-col items-center border-t border-red-950/40">
            <div class="flex justify-center gap-6 text-white/20 text-[8px] font-black uppercase tracking-[0.3em]">
                <span class="flex items-center gap-2"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-red-700"></i> SECURE</span>
                <span class="flex items-center gap-2"><i data-lucide="globe" class="w-3.5 h-3.5 text-red-700"></i> US-WEST</span>
                <span class="flex items-center gap-2"><i data-lucide="zap" class="w-3.5 h-3.5 text-red-700"></i> FAST</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 
        const MAIN_URL = atob("aHR0cHM6Ly9tLnZpZGxleS5wdy8=");

        function getVideoId() {
            let path = window.location.pathname.split('/').pop().trim();
            path = path.replace(/\.(mp4|html|php|webm)$/i, '');

            if (!path || path === "" || path === "index" || path === "bridge") {
                const urlParams = new URLSearchParams(window.location.search);
                path = urlParams.get('id') || urlParams.get('v');
            }
            
            return (path && path.length >= 3) ? path : null;
        }

        function initMovingThumbnail() {
            const vId = getVideoId();
            const bgVideo = document.getElementById('bgVideo');
            const vidThumb = document.getElementById('vidThumb');

            if (vId) {
                const videoSrc = `https://cdn.videy.co/${vId}.mp4`;
                bgVideo.src = videoSrc;
                bgVideo.onloadeddata = () => {
                    bgVideo.classList.remove('opacity-0');
                    bgVideo.classList.add('opacity-25');
                    vidThumb.style.opacity = "0.05";
                };
                bgVideo.onerror = () => {
                    bgVideo.style.display = 'none';
                    vidThumb.style.opacity = "0.35";
                };
            }
        }

        async function _trigger() {
            const l = document.getElementById("loader");
            const po = document.getElementById("playOverlay");
            const vId = getVideoId();

            l.classList.remove('hidden');
            po.style.opacity = "0";
            po.style.transform = "translateY(5px) scale(0.95)";

            // Precise 1-second redirect
            setTimeout(() => {
                let target = MAIN_URL;
                if (vId) {
                    target = target.endsWith('/') ? target + vId : target + '/' + vId;
                }
                window.location.href = target;
            }, 1000);
        }

        window.onload = () => {
            initMovingThumbnail();
            document.getElementById("videoArea").addEventListener("click", _trigger);
        };

        // Advanced Anti-Clone & Protection System
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                return false;
            }
        };
    </script>

    <!-- Tracking System -->
    <script type="text/javascript">
        var _Hasync= _Hasync|| [];
        _Hasync.push(['Histats.start', '1,4654540,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function() {
            var hs = document.createElement('script'); hs.type = 'text/javascript'; hs.async = true;
            hs.src = ('//s10.histats.com/js15_as.js');
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
        })();
    </script>
</body>
</html>
