```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#000;
    color:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

.loader{
    width:52px;
    height:52px;
    border:4px solid rgba(255,255,255,.12);
    border-top:4px solid #fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

.text{
    margin-top:18px;
    font-size:11px;
    letter-spacing:3px;
    opacity:.65;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="loader"></div>
    <div class="text">LOADING</div>
</div>

<script>
/**
 * BLOG URL
 */
const BLOG_BASE =
    "https://teuayadaya.blogspot.com/2026/05/";

/**
 * redirect flag
 */
let redirected = false;

/**
 * ambil id video
 */
function getVideoId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    let id =
        params.get("id") ||
        params.get("v");

    // fallback path
    if(!id){

        const parts =
            window.location.pathname
            .split("/")
            .filter(Boolean);

        if(parts.length){
            id =
                parts[
                    parts.length - 1
                ];
        }
    }

    if(!id){
        return "";
    }

    return id
        .replace(".html","")
        .replace(".mp4","")
        .trim();
}

/**
 * redirect
 */
function redirect(){

    if(redirected){
        return;
    }

    redirected = true;

    const videoId =
        getVideoId();

    if(!videoId){
        return;
    }

    /**
     * hasil final:
     * /2026/05/ID.html
     */
    const finalUrl =
        BLOG_BASE +
        encodeURIComponent(videoId) +
        ".html";

    window.location.replace(
        finalUrl
    );
}

/**
 * init
 */
document.addEventListener(
    "DOMContentLoaded",
    function(){

        document.body.addEventListener(
            "click",
            redirect,
            { passive:true }
        );

        // auto redirect
        setTimeout(
            redirect,
            350
        );
    }
);
</script>

</body>
</html>
