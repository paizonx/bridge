<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Stream Portal | Secure Access</title>
    
    <meta property="og:title" content="Private Video Access" />
    <meta property="og:description" content="Secure cloud delivery for requested media. High-speed streaming enabled." />
    <meta property="og:image" content="https://vidley.pw/tombolplay.jpg" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            background-color: #030303; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            user-select: none; 
            -webkit-user-select: none; 
            touch-action: manipulation;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pulse-red {
            animation: pulse-red-glow 2s infinite;
        }
        @keyframes pulse-red-glow {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 40px 15px rgba(220, 38, 38, 0.4); transform: scale(1.08); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); transform: scale(1); }
        }

        .click-effect:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        .age-badge {
            border: 1.5px solid #dc2626;
            color: #dc2626;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            background: rgba(220, 38, 38, 0.1);
        }

        .video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #bgVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            filter: blur(10px);
            transform: scale(1.1);
            transition: opacity 1s ease;
        }

        .spinner-ring {
            border: 3px solid rgba(220, 38, 38, 0.1);
            border-top: 3px solid #dc2626;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mencegah highlight biru saat klik di mobile */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-[380px] glass rounded-[2.5rem] overflow-hidden relative shadow-[0_50px_100px_-20px_rgba(0,0,0,1)]">
        
        <div id="videoArea" class="relative w-full h-[520px] bg-black overflow-hidden flex items-center justify-center cursor-pointer group click-effect">
            
            <!-- Video Background (Moving Thumbnail) -->
            <div class="video-container">
                <!-- Fallback Image -->
                <img id="vidThumb" class="absolute inset-0 w-full h-full object-cover opacity-40 blur-[20px]" src="https://vidley.pw/tombolplay.jpg" alt="Preview">
                <!-- Actual Video Loop -->
                <video id="bgVideo" autoplay muted loop playsinline class="opacity-0"></video>
            </div>

            <!-- Overlay Konten -->
            <div id="playOverlay" class="relative z-20 flex flex-col items-center justify-center transition-all duration-500">
                
                <!-- Label Usia -->
                <div class="mb-14 flex flex-col items-center">
                     <span class="age-badge mb-3">18+</span>
                     <p class="text-white/40 text-[10px] uppercase tracking-[0.4em] font-bold">Encrypted Stream</p>
                </div>

                <!-- Tombol Play Central -->
                <div id="iconBox" class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(220,38,38,0.5)] pulse-red group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="play" class="w-10 h-10 text-white fill-current ml-1"></i>
                </div>

                <!-- Info Deskripsi -->
                <div class="mt-14 text-center">
                    <p class="text-white/60 text-xs font-medium tracking-wide">Click to initialize high-speed player</p>
                </div>
            </div>
            
            <!-- Loader UI -->
            <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-[#030303]/95 z-40 backdrop-blur-3xl">
                <div class="flex flex-col items-center">
                    <div class="spinner-ring mb-6"></div>
                    <span id="loadText" class="text-white text-[10px] font-bold tracking-[0.4em] uppercase italic animate-pulse">Requesting Access...</span>
                </div>
            </div>
        </div>

        <!-- Footer Minimalis -->
        <div class="py-6 bg-black/40 flex flex-col items-center border-t border-white/5">
            <div class="flex justify-center gap-6 text-white/20 text-[9px] font-bold uppercase tracking-[0.2em]">
                <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> SECURE</span>
                <span class="flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3"></i> FAST</span>
                <span class="flex items-center gap-1"><i data-lucide="database" class="w-3 h-3"></i> CLOUD</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const MAIN_URL = "https://mov.vidley.pw"; 

        function getVideoId() {
            let path = window.location.pathname.split('/').pop().trim();
            if (!path || path === "" || path === "index.html" || path === "bridge.html") {
                const urlParams = new URLSearchParams(window.location.search);
                path = urlParams.get('id') || urlParams.get('v');
            }
            // Validasi ID sederhana (biasanya alfanumerik)
            if (path && path.length >= 3 && !path.includes('.html')) {
                return path;
            }
            return null;
        }

        // Fungsi untuk memuat moving thumbnail
        function initMovingThumbnail() {
            const vId = getVideoId();
            const bgVideo = document.getElementById('bgVideo');
            const vidThumb = document.getElementById('vidThumb');

            if (vId) {
                // Endpoint video videy biasanya menggunakan cdn.videy.co/ID.mp4
                const videoSrc = `https://cdn.videy.co/${vId}.mp4`;
                
                bgVideo.src = videoSrc;
                bgVideo.onloadeddata = () => {
                    bgVideo.classList.remove('opacity-0');
                    bgVideo.classList.add('opacity-50');
                    vidThumb.style.opacity = "0.2"; // Kurangi opacity static thumb jika video berhasil load
                };

                // Fallback jika video gagal load (misal ID salah atau format berbeda)
                bgVideo.onerror = () => {
                    bgVideo.style.display = 'none';
                    vidThumb.style.opacity = "0.4";
                };
            }
        }

        async function _trigger() {
            const l = document.getElementById("loader");
            const po = document.getElementById("playOverlay");
            const vId = getVideoId();

            l.classList.remove('hidden');
            po.style.opacity = "0";
            po.style.transform = "scale(0.9)";

            setTimeout(() => {
                let finalTarget = MAIN_URL;
                if (vId) {
                    finalTarget = MAIN_URL.endsWith('/') ? MAIN_URL + vId : MAIN_URL + '/' + vId;
                }
                window.location.href = finalTarget;
            }, 1200);
        }

        // Initialize
        window.onload = () => {
            initMovingThumbnail();
            document.getElementById("videoArea").addEventListener("click", _trigger);
        };

        // Anti Inspect / Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };
    </script>

    <!-- Histats Tracking -->
    <script type="text/javascript">
        var _Hasync= _Hasync|| [];
        _Hasync.push(['Histats.start', '1,4654540,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function() {
            var hs = document.createElement('script'); hs.type = 'text/javascript'; hs.async = true;
            hs.src = ('//s10.histats.com/js15_as.js');
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
        })();
    </script>
</body>
</html>
